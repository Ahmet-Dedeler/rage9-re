[package]
name = "rage9-re"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Decoder and inspector for RAGE9 script.rpf and anim.rpf, with glTF 2.0 animation export"
repository = "https://github.com/Ahmet-Dedeler/rage9-re"

[lib]
name = "rage9_re"
path = "src/lib.rs"

[[bin]]
name = "rage9-re"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
